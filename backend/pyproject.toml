[project]
name = "reimbursement"
version = "0.1.0"
description = "Evidence-based reimbursement application"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2,<3",
  "sqlalchemy>=2,<3",
  "psycopg[binary,pool]>=3,<4",
  "alembic>=1,<2",
  "langchain>=1,<2",
  "langgraph>=1,<2",
  "langgraph-checkpoint-postgres>=3,<4",
  "python-multipart>=0.0.20",
  "pillow>=11",
  "pypdfium2>=4",
  "openpyxl>=3.1",
  "cryptography>=44",
  "langchain-openai>=1,<2",
  "langchain-deepseek>=1,<2",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "httpx>=0.28", "ruff>=0.12", "mypy>=1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reimbursement"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true
